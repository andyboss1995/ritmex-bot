<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritmex Bot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-slate-900 text-white min-h-screen p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1
                    class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                    Ritmex Dashboard</h1>
                <p class="text-slate-400 text-sm mt-1">Real-time Monitoring & Control</p>
            </div>
            <div id="status-indicator"
                class="flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/20 text-green-400 text-xs">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span>Online</span>
            </div>
        </header>

        <!-- Balance Cards -->
        <div id="balance-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <!-- Injected by JS -->
            <div class="glass rounded-xl p-6 animate-pulse">
                <div class="h-4 bg-slate-700 rounded w-1/3 mb-4"></div>
                <div class="h-8 bg-slate-700 rounded w-1/2 mb-2"></div>
                <div class="h-4 bg-slate-700 rounded w-2/3"></div>
            </div>
        </div>

        <!-- System Control -->
        <div class="mb-10">
            <h2 class="text-xl font-semibold mb-4 text-slate-200 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                    </path>
                </svg>
                Process Manager
            </h2>
            <div class="glass rounded-xl overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800/50 text-slate-400 text-xs uppercase">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Name</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Resources</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="process-list" class="text-sm divide-y divide-slate-700/50">
                        <!-- Injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        async function fetchStatus() {
            try {
                const res = await fetch(`${API_URL}/status`);
                const data = await res.json();
                renderBalances(data.bots);
                renderProcesses(data.processes);
                document.getElementById('status-indicator').innerHTML = 
                    `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span><span>Online</span>`;
                document.getElementById('status-indicator').className = "flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/20 text-green-400 text-xs";
            } catch (e) {
                console.error(e);
                document.getElementById('status-indicator').innerHTML = 
                    `<span class="w-2 h-2 rounded-full bg-red-500"></span><span>Disconnected</span>`;
                    document.getElementById('status-indicator').className = "flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/20 text-red-400 text-xs";
            }
        }

        function renderBalances(bots) {
            const container = document.getElementById('balance-container');
            container.innerHTML = bots.map(bot => {
                const isProfit = parseFloat(bot.upnl) >= 0;
                return `
                <div class="glass rounded-xl p-6 border-t-4 ${bot.type === 'GRVT' ? 'border-blue-500' : 'border-purple-500'} hover:bg-slate-800/50 transition-colors">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-slate-400 text-xs uppercase tracking-wider font-bold">${bot.type}</h3>
                            <p class="text-lg font-medium text-white">${bot.name}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded-lg">
                            <span class="text-xs text-slate-500">USDT</span>
                        </div>
                    </div>
                    <div class="mb-4">
                        <p class="text-3xl font-bold font-mono">$${bot.balance}</p>
                        <p class="text-xs text-slate-400 mt-1">Wallet Balance</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 border-t border-slate-700/50 pt-4">
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Unrealized PnL</p>
                            <p class="text-xl font-mono ${isProfit ? 'text-green-400' : 'text-red-400'}">
                                ${isProfit ? '+' : ''}${bot.upnl}
                            </p>
                        </div>
                        
                        <div class="text-right">
                            ${bot.position && Math.abs(bot.position.positionAmt) > 0 ? `
                                <p class="text-xs text-slate-400 mb-1">Position (${bot.symbol || '---'})</p>
                                <div class="flex flex-col items-end">
                                    <span class="text-xl font-bold text-white font-mono leading-none">${bot.position.positionAmt}</span>
                                    <span class="text-xs text-slate-500 mt-1">@ ${parseFloat(bot.position.entryPrice).toFixed(1)}</span>
                                </div>
                            ` : `
                                <p class="text-xs text-slate-500 mb-1">Position</p>
                                <p class="text-sm text-slate-600 italic">Empty</p>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderProcesses(processes) {
            const tbody = document.getElementById('process-list');
            tbody.innerHTML = processes.map(p => `
                <tr class="hover:bg-slate-800/30 transition-colors">
                    <td class="p-4 font-mono text-slate-500">#${p.id}</td>
                    <td class="p-4 font-medium text-white">${p.name}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${p.status === 'online' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                            ${p.status.toUpperCase()}
                        </span>
                    </td>
                    <td class="p-4 text-slate-400 text-xs">
                        MEM: ${(p.memory / 1024 / 1024).toFixed(0)} MB<br>
                        CPU: ${p.cpu}%
                    </td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick="controlProcess('restart', ${p.id})" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white text-xs rounded transition-colors">Restart</button>
                        <button onclick="controlProcess('stop', ${p.id})" class="px-3 py-1 bg-red-600/80 hover:bg-red-500 text-white text-xs rounded transition-colors">Stop</button>
                    </td>
                </tr>
            `).join('');
        }

        async function controlProcess(action, id) {
            if (!confirm(`Are you sure you want to ${action} process #${id}?`)) return;
            try {
                await fetch(`${API_URL}/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, id })
                });
                // Delay refresh slightly
                setTimeout(fetchStatus, 1000);
            } catch (e) {
                alert('Action failed: ' + e);
            }
        }

        // Initial Load & Poll
        fetchStatus();
        setInterval(fetchStatus, 2000);
    </script>
</body>

</html>
